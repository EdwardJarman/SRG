name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/spaced-repetition-garden-${VERSION}.zip"
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}."
          fi
          gh release create "${GITHUB_REF_NAME}" "$ZIP" --title "${GITHUB_REF_NAME}" --notes "$NOTES"
