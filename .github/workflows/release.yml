name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/spaced-repetition-garden-${VERSION}.zip"
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}."
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ZIP" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" "$ZIP" --title "${GITHUB_REF_NAME}" --notes "$NOTES"
          fi
